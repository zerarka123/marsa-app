name: Create upload keystore (مرة واحدة فقط)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        run: |
          mkdir -p out
          STOREPASS=$(openssl rand -hex 16)
          echo "::add-mask::$STOREPASS"
          ALIAS=marsa-upload
          keytool -genkeypair -v -keystore out/marsa-upload.jks -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STOREPASS" -keypass "$STOREPASS" \
            -dname "CN=Marsa, OU=Marsa, O=Marsa, L=Alger, C=DZ"
          base64 -w0 out/marsa-upload.jks > out/ANDROID_KEYSTORE_BASE64.txt
          {
            echo "اضغط Settings > Secrets and variables > Actions > New repository secret وأضف 4 أسرار:"
            echo ""
            echo "ANDROID_KEYSTORE_BASE64   = (محتوى ملف ANDROID_KEYSTORE_BASE64.txt كاملاً)"
            echo "ANDROID_KEYSTORE_PASSWORD = $STOREPASS"
            echo "ANDROID_KEY_ALIAS         = $ALIAS"
            echo "ANDROID_KEY_PASSWORD      = $STOREPASS"
            echo ""
            echo "⚠️ احتفظ بنسخة من marsa-upload.jks وكلمة المرور في مكان آمن (Google Drive خاص + هاتفك)."
            echo "⚠️ إن ضاع المفتاح تحتاج طلب إعادة تعيين من Google Play. لا تُنشئ مفتاحاً جديداً بعد النشر."
          } > out/SECRETS-README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: marsa-upload-keystore
          path: out/*
          retention-days: 3
