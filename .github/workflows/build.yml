name: Build Android (APK + AAB لمتجر Google Play)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: "1.0.0"
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Add Android project
        run: npx cap add android

      - name: Generate icons and splash
        run: npx --yes @capacitor/assets@3 generate --android --assetPath assets

      - name: Sync web assets
        run: npx cap sync android

      - name: Patch Android project for Google Play
        run: node scripts/patch-android.mjs
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Build debug APK + release AAB + release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Sign release (AAB + APK)
        id: sign
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/marsa-debug-TEST-ONLY.apk
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::لم تُضَف أسرار التوقيع (ANDROID_KEYSTORE_*). تم بناء نسخة التجربة فقط. شغّل workflow «Create upload keystore» ثم أضف الأسرار."
            exit 0
          fi
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.jks"; then
            echo "::error::سر ANDROID_KEYSTORE_BASE64 غير صالح: أعد لصق محتوى ملف ANDROID_KEYSTORE_BASE64.txt وحده."
            exit 1
          fi
          echo "تشخيص: طول سر BASE64 = ${#KEYSTORE_B64} حرفاً | حجم الملف بعد فك التشفير = $(stat -c%s "$RUNNER_TEMP/upload.jks") بايت"
          echo "تشخيص: طول كلمة مرور المخزن = ${#KEYSTORE_PASSWORD} | طول كلمة مرور المفتاح = ${#KEY_PASSWORD} | الاسم المستعار = $KEY_ALIAS"
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass:env KEYSTORE_PASSWORD; then
            echo "::error::تعذّر فتح ملف المفتاح: إما أن سر ANDROID_KEYSTORE_BASE64 ناقص/مقطوع، أو أن ANDROID_KEYSTORE_PASSWORD خاطئ (انظر رسالة keytool أعلاه)."
            exit 1
          fi
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          cp "$AAB" out/marsa-release.aab
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 out/marsa-release.aab "$KEY_ALIAS"
          jarsigner -verify out/marsa-release.aab | grep -q "jar verified"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out out/marsa-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify out/marsa-release.apk
          rm -f "$RUNNER_TEMP/upload.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: marsa-android
          path: out/*
          if-no-files-found: error
